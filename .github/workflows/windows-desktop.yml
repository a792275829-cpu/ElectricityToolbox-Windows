name: Windows desktop
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      installer:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      installer:
        description: Build the self-contained NSIS installer
        type: boolean
        default: true

permissions:
  contents: read
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/price-xlsx -> target
            desktop/src-tauri -> target
      - run: python -m pip install uv -r packaging/windows/requirements.txt
      - run: python native/price-xlsx/build.py
      - run: cargo test --manifest-path native/price-xlsx/Cargo.toml --locked
      - name: Desktop and toolbox fast tier
        run: python tools/run_tests.py
      - name: Windows updater, service and UI contracts
        run: >-
          python tools/run_tests.py
          --module test_windows_platform --module test_windows_update
          --module test_update_ui --module test_rust_service
          --module test_windows_update_helper --module test_windows_delta
          --module test_windows_update_build --module test_service
          --module test_ui_layers --module test_rust_ui_bridge
      - name: Workbook and native backend regression
        env:
          TOOLBOX_XLSX_BACKEND: rust
          TOOLBOX_COMPUTE_BACKEND: rust
        run: >-
          python tools/run_tests.py
          --module test_native_excel --module test_native_updates
          --module test_workbook_commit --module test_report_output_lock
          --module test_date_inputs --module test_transaction_info_update
          --module test_guangdong_price
      - run: npm ci
        working-directory: desktop
      - run: npm run web:build
        working-directory: desktop
      - name: Compile and test Rust desktop protocol
        run: |
          New-Item -ItemType Directory -Force desktop/src-tauri/payload | Out-Null
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m venv .venv --system-site-packages
          uv python install (Get-Content .python-version) --install-dir .toolbox/standalone-python --no-bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = Get-ChildItem .toolbox/standalone-python -Directory -Filter '*windows-x86_64-none' | Select-Object -First 1
          ./packaging/windows/build.ps1 -PythonRoot $runtime.FullName
      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.installer
        with:
          name: electricity-toolbox-windows-x64
          path: dist/windows/*
          if-no-files-found: error
