name: Windows desktop
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
      full_only:
        type: boolean
        default: false
      installer:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Optional existing version tag (empty builds main)
        type: string
        default: ''
      full_only:
        description: Reset the patch baseline with a full installer
        type: boolean
        default: false
      installer:
        description: Build the self-contained NSIS installer
        type: boolean
        default: true

permissions:
  contents: read
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || (github.event_name == 'workflow_dispatch' && 'main' || github.ref) }}
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/price-xlsx -> target
            desktop/src-tauri -> target
      - run: python -m pip install uv -r packaging/windows/requirements.txt
      - name: Install Chromium for browser lifecycle regressions
        run: python -m playwright install chromium
      - name: Source launcher dependency and version smoke
        run: ./start_source_test.ps1 -Smoke -Python (Get-Command python).Source
      - run: python native/price-xlsx/build.py
      - run: cargo test --manifest-path native/price-xlsx/Cargo.toml --locked
      - name: Validate version and release notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $versionArgs = @('packaging/tauri/version.py', 'check', '--require-notes')
          if ($env:RELEASE_TAG) { $versionArgs += @('--tag', $env:RELEASE_TAG) }
          python @versionArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install optional uploader dependencies
        run: npm ci --prefix 电力工具脚本/private-data-uploader-tool --ignore-scripts --no-audit --no-fund
      - name: All registered Python and Node regressions
        env:
          TOOLBOX_XLSX_BACKEND: rust
          TOOLBOX_COMPUTE_BACKEND: rust
          TOOLBOX_500KV_BACKEND: rust
        run: python tools/run_tests.py full --strict
      - run: npm ci
        working-directory: desktop
      - run: npm run web:build
        working-directory: desktop
      - name: Compile and test Rust desktop protocol
        run: |
          New-Item -ItemType Directory -Force desktop/src-tauri/payload | Out-Null
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m venv .venv --system-site-packages
          uv python install (Get-Content .python-version) --install-dir .toolbox/standalone-python --no-bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = Get-ChildItem .toolbox/standalone-python -Directory -Filter '*windows-x86_64-none' | Select-Object -First 1
          if (-not $runtime) { throw 'Pinned standalone Python runtime was not installed.' }
          $buildArgs = @{ PythonRoot = $runtime.FullName }
          if (-not '${{ inputs.tag }}') { $buildArgs.DevelopmentBuild = $true }
          if ('${{ inputs.full_only }}' -eq 'true') { $buildArgs.FullOnly = $true }
          ./packaging/windows/build.ps1 @buildArgs
      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.installer
        with:
          name: ${{ inputs.tag && 'electricity-toolbox-windows-x64' || 'electricity-toolbox-windows-x64-development' }}
          path: |
            dist/windows/*
            dist/windows-development/*
          if-no-files-found: error
