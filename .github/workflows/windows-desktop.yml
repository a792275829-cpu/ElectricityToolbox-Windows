name: Windows desktop
on:
  push:
    branches: [development, "codex/**"]
  pull_request:
    branches: [development]
  workflow_call:
    inputs:
      installer:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      installer:
        description: Build the self-contained NSIS installer
        type: boolean
        default: true

permissions:
  contents: read
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'development' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/price-xlsx -> target
            desktop/src-tauri -> target
      - run: python -m pip install uv -r packaging/windows/requirements.txt
      - run: python native/price-xlsx/build.py
      - run: cargo test --manifest-path native/price-xlsx/Cargo.toml --locked
      - run: python -m unittest discover -s desktop/tests/python -p test_windows_platform.py -v
      - name: Windows updater and task handoff regression
        run: |
          python -m unittest discover -s desktop/tests/python -p test_windows_update.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s desktop/tests/python -p test_update_ui.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s desktop/tests/python -p test_rust_service.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s desktop/tests/python -p test_windows_update_helper.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s desktop/tests/python -p test_windows_delta.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s desktop/tests/python -p test_windows_update_build.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Workbook and native backend regression
        working-directory: 电力工具箱
        run: |
          $env:PYTHONPATH = (Resolve-Path '..').Path
          python -m unittest tests.test_native_excel tests.test_native_updates tests.test_workbook_commit tests.test_report_output_lock tests.test_date_inputs -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm ci
        working-directory: desktop
      - run: npm run web:build
        working-directory: desktop
      - name: Compile and test Rust desktop protocol
        run: |
          New-Item -ItemType Directory -Force desktop/src-tauri/payload | Out-Null
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m venv .venv --system-site-packages
          uv python install 3.12 --install-dir .toolbox/standalone-python --no-bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = Get-ChildItem .toolbox/standalone-python -Directory -Filter '*windows-x86_64-none' | Select-Object -First 1
          ./packaging/windows/build.ps1 -PythonRoot $runtime.FullName
      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.installer
        with:
          name: electricity-toolbox-windows-x64
          path: dist/windows/*
          if-no-files-found: error
