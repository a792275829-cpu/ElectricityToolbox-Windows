name: Desktop checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            requirements: packaging/tauri/requirements-macos.lock
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - run: python3 packaging/tauri/version.py check --require-notes
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Read pinned Python version
        run: |
          echo "TOOLBOX_PYTHON_VERSION=$(tr -d '\r\n' < .python-version)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.TOOLBOX_PYTHON_VERSION }}
          activate-environment: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: >-
          uv pip install --python python --require-hashes --no-deps --only-binary :all: -r ${{ matrix.requirements }}
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run web:build
        working-directory: desktop
      - run: python native/price-xlsx/build.py
      - name: Toolbox fast tier (no GUI or network cases)
        run: python tools/run_tests.py
      - name: Toolbox modules against the Rust backend
        env:
          TOOLBOX_XLSX_BACKEND: rust
          TOOLBOX_COMPUTE_BACKEND: rust
        run: >-
          python tools/run_tests.py
          --module test_native_excel --module test_summary_station_folder
          --module test_remaining_native --module test_native_updates
          --module test_all_trial_optimizations --module test_power_benefit_update
          --module test_transaction_info_update --module test_daily_pdf_parser
          --module test_workbook_inspection --module test_tasks
      - name: 500kV section modules against the Rust backend
        env:
          TOOLBOX_500KV_BACKEND: rust
        run: python tools/run_tests.py --group section
      - name: Create synthetic forecast workbook for CI smoke build
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import Workbook
          Path("dist").mkdir(exist_ok=True)
          book = Workbook()
          sheet = book.active
          sheet.title = "整合数据"
          sheet.append(["日期", "时刻", "全省日前平均电价"])
          sheet.append(["2026-01-01", "00:00", 0.0])
          book.save("dist/ci-forecast.xlsx")
          book.close()
          PY
      - run: python packaging/tauri/prepare_payload.py --target ${{ matrix.target }} --forecast-workbook dist/ci-forecast.xlsx
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --no-bundle --target ${{ matrix.target }}
        working-directory: desktop
