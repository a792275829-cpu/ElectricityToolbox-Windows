name: Publish macOS release from development
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag
        required: true
        type: string
      full_only:
        description: Reset the incremental update baseline with a full installer
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    uses: a792275829-cpu/ElectricityToolbox-Windows/.github/workflows/desktop-release.yml@development
    with:
      tag: ${{ inputs.tag }}
      full_only: ${{ inputs.full_only }}
    secrets: inherit
