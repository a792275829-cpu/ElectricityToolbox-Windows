name: Build Windows release artifacts from main
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag
        required: true
        type: string
      full_only:
        description: Reset the incremental update baseline with a full installer
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release:
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ inputs.tag }}
      full_only: ${{ inputs.full_only }}
