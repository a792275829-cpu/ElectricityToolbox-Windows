# Compatibility entry point: build artifacts only. Releases are uploaded manually.
name: Desktop build (manual release)
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      full_only:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to validate
        required: true
        type: string
      full_only:
        description: Build a full installer and reset the patch baseline
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  windows:
    uses: ./.github/workflows/windows-desktop.yml
    with:
      installer: true
      tag: ${{ inputs.tag }}
      full_only: ${{ inputs.full_only }}
